<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CinetixOS 503 · Subtítulos para proyección</title>
<style>
  :root{
    --bg:#0b0d12; --panel:#12151d; --panel2:#171b25; --line:#242a38;
    --txt:#e8ecf4; --muted:#8b93a7; --accent:#5b8cff; --accent2:#7c5cff;
    --ok:#3ecf8e; --warn:#ffb347; --err:#ff5c72;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 70% -10%,#1a2033 0,var(--bg) 55%);
    color:var(--txt);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;min-height:100vh}
  header{padding:28px 32px 8px}
  h1{margin:0;font-size:22px;letter-spacing:-.02em}
  h1 span{color:var(--accent)}
  .sub{color:var(--muted);font-size:13px;margin-top:4px}
  main{max-width:960px;margin:0 auto;padding:16px 32px 64px}
  .card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);
    border-radius:16px;padding:22px;margin-top:20px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
  .drop{border:1.5px dashed #2f3850;border-radius:14px;padding:34px;text-align:center;cursor:pointer;
    transition:.2s;background:#0e1119}
  .drop:hover,.drop.on{border-color:var(--accent);background:#101526}
  .drop b{color:var(--accent)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em}
  select,input[type=text]{width:100%;background:#0d1017;border:1px solid var(--line);color:var(--txt);
    border-radius:10px;padding:10px 12px;font-size:14px}
  .chk{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;margin-top:14px}
  button{margin-top:18px;width:100%;padding:13px;border:0;border-radius:12px;font-weight:600;font-size:15px;
    color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));cursor:pointer;transition:.2s}
  button:disabled{opacity:.45;cursor:not-allowed}
  .bar{height:8px;background:#0d1017;border-radius:99px;overflow:hidden;margin-top:18px;border:1px solid var(--line)}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--ok));transition:width .3s}
  .step{color:var(--muted);font-size:13px;margin-top:10px;min-height:18px}
  .links{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap}
  .links a{color:var(--txt);text-decoration:none;background:#0d1017;border:1px solid var(--line);
    padding:10px 14px;border-radius:10px;font-size:13px}
  .links a:hover{border-color:var(--accent)}
  .pill{display:inline-block;font-size:11px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
  .pill.ok{color:var(--ok);border-color:#1f5c42}.pill.warn{color:var(--warn);border-color:#5c4a1f}
  .pill.err{color:var(--err);border-color:#5c1f2a}
  pre{background:#0d1017;border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;font-size:12px;color:var(--muted)}
  @media(max-width:640px){.row{grid-template-columns:1fr}main{padding:12px 16px 48px}header{padding:20px 16px 4px}}
</style>
</head>
<body>
<header>
  <h1>🎬 CinetixOS <span>503</span> · Subtítulos para proyección</h1>
  <div class="sub">Quita los subtítulos existentes (pista o quemados) y añade una pista blanda en castellano. 100% local ($0.00).</div>
</header>
<main>
  <div class="card">
    <div class="drop" id="drop">
      <b>Arrastra aquí el corto</b> o haz clic para elegirlo<br>
      <span class="sub">MP4 · MOV · MKV · AVI · WEBM</span>
      <input type="file" id="file" accept="video/*" hidden>
    </div>
    <div class="row">
      <div>
        <label>Modelo Whisper</label>
        <select id="whisper">
          <option value="">Auto (small)</option>
          <option value="tiny">tiny (rápido)</option>
          <option value="base">base</option>
          <option value="small">small</option>
          <option value="medium">medium</option>
          <option value="large-v3">large-v3 (mejor)</option>
        </select>
      </div>
      <div>
        <label>Subtítulos quemados</label>
        <select id="burned">
          <option value="auto">Auto (detectar)</option>
          <option value="none">No tocar</option>
          <option value="delogo">Parchear (delogo)</option>
          <option value="blur">Difuminar</option>
          <option value="cover">Tapar en negro</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div>
        <label>Modelo de traducción (Ollama)</label>
        <input type="text" id="tmodel" placeholder="Auto (mistral-nemo)">
      </div>
      <div>
        <label>Idioma destino</label>
        <input type="text" id="target" value="es">
      </div>
    </div>
    <div class="chk"><input type="checkbox" id="strip" checked> <label style="margin:0;text-transform:none">Eliminar pistas de subtítulo existentes</label></div>
    <div class="chk"><input type="checkbox" id="force"> <label style="margin:0;text-transform:none">Subtitular aunque ya esté en castellano</label></div>
    <button id="go" disabled>Procesar corto</button>
    <div class="bar"><i id="bar"></i></div>
    <div class="step" id="step"></div>
    <div class="links" id="links"></div>
  </div>

  <div class="card" id="reportCard" style="display:none">
    <div style="display:flex;gap:10px;align-items:center;justify-content:space-between">
      <b>Informe</b><span id="status" class="pill">—</span>
    </div>
    <pre id="report"></pre>
  </div>
</main>
<script src="/static/app.js"></script>
</body>
</html>
